<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI 总结</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f6f7f9; color: #24292f;
    }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: #1e1f24; color: #e8e8ec;
      padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .topbar .path { font-size: 12px; color: #9a9aa5; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar .actions { display: flex; gap: 8px; flex: none; }
    .topbar button {
      background: #fb7299; color: #fff; border: none; border-radius: 6px;
      padding: 6px 14px; cursor: pointer; font-size: 13px;
    }
    .topbar button.secondary { background: #3a3b42; color: #e8e8ec; }
    .content {
      max-width: 820px; margin: 24px auto 60px; background: #fff;
      border-radius: 10px; padding: 32px 40px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); line-height: 1.8;
      word-break: break-word; font-size: 17px;
    }
    .content h1 { font-size: 26px; border-bottom: 2px solid #fb7299; padding-bottom: 10px; margin-bottom: 8px; }
    .content h2 { font-size: 21px; margin-top: 36px; border-left: 4px solid #fb7299; padding-left: 10px; }
    .content h3 { font-size: 17px; margin-top: 22px; color: #0b5cab; }
    .content blockquote { margin: 12px 0; padding: 8px 14px; background: #f0f6ff; border-left: 3px solid #79b8ff; color: #57606a; font-size: 14px; }
    .content ul { padding-left: 22px; }
    .content li { margin: 5px 0; }
    .content p { margin: 10px 0; }
    .content hr { border: none; border-top: 1px dashed #d0d7de; margin: 24px 0; }
    .content code { background: rgba(175,184,193,.2); padding: 1px 6px; border-radius: 4px; font-size: 13px; }
    .empty { max-width: 600px; margin: 80px auto; text-align: center; color: #6e7781; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="path" id="savedPath"></span>
    <div class="actions">
      <button id="downloadBtn" class="secondary" hidden>⬇️ 下载 .md</button>
      <button id="closeBtn">关闭</button>
    </div>
  </div>
  <div class="content" id="content"></div>
  <script src="db.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
